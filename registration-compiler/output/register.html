<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sarthi-X Registration</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.2), transparent 32%), radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.16), transparent 30%), linear-gradient(135deg, #020617 0%, #0c1724 100%);
      color: #e2e8f0;
    }

    .page {
      width: min(100%, 1080px);
      border-radius: 32px;
      padding: 36px;
      background: rgba(12, 18, 34, 0.88);
      backdrop-filter: blur(24px);
      box-shadow: 0 32px 90px rgba(5, 11, 34, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 30px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.6rem, 4vw, 3.4rem);
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 0;
      color: #9fb4d3;
      max-width: 520px;
      font-size: 1rem;
    }

    .form-section {
      display: grid;
      gap: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .form-group {
      display: grid;
      gap: 12px;
    }

    .form-group label {
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.88);
      color: #f8fafc;
      outline: none;
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
      transform: translateY(-1px);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: #60a5fa;
    }

    .button {
      width: 100%;
      padding: 18px 20px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
      box-shadow: 0 18px 40px rgba(56, 189, 248, 0.24);
    }

    .button:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    @media (max-width: 900px) {
      .page {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 24px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <section class="page">
    <div class="hero">
      <h1>Sarthi-X Registration</h1>
      <p>Create your student account with Sarthi-X.</p>
    </div>
    <form class="form-section">
      <div class="form-grid">
        <div class="form-group"><label for="full-name">Full Name</label><input id="full-name" type="text" placeholder="Jane Doe" /></div>
        <div class="form-group"><label for="email">Email</label><input id="email" type="email" placeholder="student@example.com" /></div>
        <div class="form-group"><label for="phone">Phone</label><input id="phone" type="tel" placeholder="(123) 456-7890" /></div>
        <div class="form-group"><label for="student-id">Student ID</label><input id="student-id" type="text" placeholder="S1234567" /></div>
        <div class="form-group"><label for="password">Password</label><input id="password" type="password" placeholder="Create a password" /></div>
        <div class="form-group"><label for="confirm-password">Confirm Password</label><input id="confirm-password" type="password" placeholder="Confirm your password" /></div>
        <div class="form-group"><label for="gender">Gender</label><select id="gender"><option value="">Select gender</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Prefer not to say</option></select></div>
        <div class="form-group"><label for="birth-date">Date of Birth</label><input id="birth-date" type="date" /></div>
        <div class="form-group"><label for="course">Course</label><select id="course"><option value="">Select course</option><option>Computer Science</option><option>Engineering</option><option>Business Management</option><option>Design</option></select></div>
        <div class="form-group"><label for="year">Academic Year</label><select id="year"><option value="">Select year</option><option>First Year</option><option>Second Year</option><option>Third Year</option><option>Final Year</option></select></div>
      </div>
      <div class="checkbox-group"><input id="terms" type="checkbox" /><label for="terms">I agree to the terms and conditions</label></div>
      <button class="button" type="button">Register Now</button>
    </form>
  </section>
</body>
</html>
